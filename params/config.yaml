# SPQA Config - Reconstructed from Successful Run 28
seed: 42

data:
  raw_data_root: 'C:\Users\Lab\OneDrive\Desktop\SPQA\folds\fold_4\pseudo_labels'
  training_ids: 'C:\Users\Lab\OneDrive\Desktop\SPQA\folds\fold_4\fold_4\training_ids.txt'

model:
  in_channels: 2
  out_channels: 1
  latent_dim: 2048
  image_size: [256, 256, 256]

train:
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.001  # 10x boost - required for U-Net with Batch Norm skip connections
  epochs: 2500
  save_dir: 'C:\Users\Lab\OneDrive\Desktop\SPQA\logs\vae_checkpoints'
  kld_weight: 0.0 # Set >0.0 to make it probabilistic

phases:
  # Smooth schedule: dice weight stays higher in late phases to prevent plateau
  phase1_volume:
    threshold: 0.0
    dice: 8.0
    contour: 0.0
    bce: 0.125
    band_size: 0

  phase2_micro1:

# SPQA Config - Reconstructed from Successful Run 28
seed: 42

data:
  raw_data_root: 'C:\Users\Lab\OneDrive\Desktop\SPQA\folds\fold_4\pseudo_labels'
  training_ids: 'C:\Users\Lab\OneDrive\Desktop\SPQA\folds\fold_4\training_ids.txt'

model:
  in_channels: 2
  out_channels: 1
  latent_dim: 2048
  image_size: [256, 256, 256]
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  kernel_size: 3
  norm: 'BATCH'
  dropout: 0.0


    dice: 2.0
    contour: 0.5
    bce: 0.05
    band_size: 3

  phase3_micro1:
    threshold: 0.87
    dice: 1.5
    contour: 0.6
    bce: 0.03
    band_size: 2

  phase3_micro2:
    threshold: 0.89
    dice: 1.5
    contour: 0.8
    bce: 0.03
    band_size: 2

  phase4_micro1:
    threshold: 0.91
